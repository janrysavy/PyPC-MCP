name: Live DOS command integration
on:
  pull_request:
  push:
    branches: [master, ai-re-agent]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dos-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        test: [test_dos_live.py, test_dos_live_mirror.py, test_dos_live_validation.py]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nasm
          python -m pip install pytest lz4==4.4.5
      - name: Record reproducible worker build
        if: matrix.test == 'test_dos_live_validation.py'
        run: |
          nasm -f bin guest/dos_control.asm -o /tmp/DOSCTRL.COM
          python - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          source = Path('guest/dos_control.asm').read_bytes()
          binary = Path('/tmp/DOSCTRL.COM').read_bytes()
          # This is our MIT-licensed worker only, never DOS or compiler inputs.
          report = {'source_sha256': hashlib.sha256(source).hexdigest(),
                    'binary_sha256': hashlib.sha256(binary).hexdigest(),
                    'binary_base64': base64.b64encode(binary).decode('ascii')}
          print('::notice title=DOSCTRL_BUILD::' + json.dumps(report))
          PY
      - name: Boot DOS and test real command execution
        env:
          PYPC_LIVE_DOS: '1'
          TEST_MODULE: ${{ matrix.test }}
        run: python -m pytest -q -s "tests/$TEST_MODULE" --basetemp live-results
      - name: Retain reports only, never disk or compiler binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dos-live-${{ matrix.test }}-${{ github.run_id }}
          path: |
            live-results/**/report.json
            live-results/**/stdout.log
            live-results/**/stderr.log
          if-no-files-found: warn
          retention-days: 14
