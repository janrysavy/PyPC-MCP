name: Publish verified CPU LOCK prefix patch
on:
  push:
    branches: [diagnostics/lock-prefix-20260921]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest pytest-subtests
      - name: Apply the locally reproduced patch and run the full suite
        run: |
          git apply --check bootstrap/lock-prefix.patch
          git apply bootstrap/lock-prefix.patch
          python -m pytest -q
      - name: Publish a clean independent fix branch without bootstrap files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add i8088.py tests/test_cpu_lock.py
          git rm bootstrap/lock-prefix.patch .github/workflows/apply-lock-prefix.yml
          tree=$(git write-tree)
          commit=$(printf 'Decode LOCK as a prefix without a false trap boundary\n\n16 regression cases fail before the patch and pass after.\n' | git commit-tree "$tree" -p 88bf6d1ad996658ede3200c2bde71ec37aafd848)
          git push origin "$commit:refs/heads/fix/cpu-lock-prefix-20260921"
          echo "Published clean fix commit $commit"
