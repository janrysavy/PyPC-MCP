name: Temporary physical 8088 reference export
on:
  push:
    branches: [debug/8088-reference-audit]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Export selected functional states without bus-cycle arrays
        shell: python
        run: |
          import concurrent.futures, gzip, hashlib, json, pathlib, urllib.request
          ref = 'aea84484abc79d09639d855b7b0ab32bc9e4dbeb'
          root = pathlib.Path('/tmp/reference'); root.mkdir()
          raw = 'https://raw.githubusercontent.com/SingleStepTests/8088/' + ref + '/'
          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'PyPC-functional-audit'})
              with urllib.request.urlopen(req, timeout=90) as response:
                  return response.read()
          tree = json.loads(get('https://api.github.com/repos/SingleStepTests/8088/git/trees/' + ref + '?recursive=1'))
          selected = set('01 03 11 19 27 2F 37 3F 8C 8E 8F 9D CF C4 C5 D0 D1 D2 D3 F6 F7 A1 A3 A5 A7 AB AD AF'.split())
          files = [x for x in tree['tree'] if x['path'].startswith('v2/') and x['path'].endswith('.json.gz') and x['path'].split('/')[1][:2].upper() in selected]
          def convert(entry):
              path = entry['path']; data = get(raw + path)
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual == entry['sha'], (path, actual, entry['sha'])
              cases = json.loads(gzip.decompress(data))
              for case in cases:
                  case.pop('cycles', None)
                  case['initial'].pop('queue', None)
                  case['final'].pop('queue', None)
              target = root / pathlib.PurePosixPath(path).name
              with gzip.open(target, 'wt') as out:
                  json.dump(cases, out, separators=(',', ':'))
              return {'path': path, 'source_blob': actual, 'source_sha256': hashlib.sha256(data).hexdigest(), 'count': len(cases)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              manifest = list(pool.map(convert, files))
          for path in ['v2/metadata.json', 'LICENSE', 'README.md']:
              (root / pathlib.PurePosixPath(path).name).write_bytes(get(raw + path))
          (root / 'manifest.json').write_text(json.dumps({'repository': 'SingleStepTests/8088', 'commit': ref, 'omitted': ['cycles', 'initial.queue', 'final.queue'], 'files': manifest}, indent=2))
          print('Exported', len(manifest), 'files and', sum(x['count'] for x in manifest), 'functional cases')
      - uses: actions/upload-artifact@v4
        with:
          name: physical-8088-functional-reference
          path: /tmp/reference
          retention-days: 1
          if-no-files-found: error
