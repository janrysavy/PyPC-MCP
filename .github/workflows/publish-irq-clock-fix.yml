name: Publish tested IRQ clock fix
on:
  push:
    branches: [fix/irq-device-clocks-20260922]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/irq-device-clocks-20260922
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - name: Apply the exact locally tested one-line change
        run: |
          test "$(git hash-object i8088.py)" = 9502d6be0894bd57c5c14f961ce383044a0737df
          python - <<'PY'
          from pathlib import Path
          p = Path('i8088.py')
          text = p.read_text()
          old = '                    self._state._clock += cycle_count\n\n                    return cycle_count'
          new = '                    self._state._clock += cycle_count\n                    self._io.Tick(cycle_count, self._state._clock)\n\n                    return cycle_count'
          assert text.count(old) == 1
          p.write_text(text.replace(old, new))
          PY
          test "$(git hash-object i8088.py)" = 86d0c7c26c371772484f2d14a451c98dd9751424
      - name: Test the independently applicable fix
        run: python -m pytest -q
      - name: Commit only the tested code and regression file
        run: |
          git rm .github/workflows/publish-irq-clock-fix.yml
          git add i8088.py tests/test_irq_device_clocks.py
          test "$(git write-tree)" = c58235d276c4831c94a090d31932bf1c1527bd22
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Advance device clocks during hardware interrupt entry'
          git push origin HEAD:refs/heads/fix/irq-device-clocks-20260922
