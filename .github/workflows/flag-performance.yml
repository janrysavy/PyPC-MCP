name: Flag correctness and benchmark
on:
  pull_request:
  push:
    branches: [perf/flag-fastpaths-20260921]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - run: python benchmarks/benchmark_flags.py --ticks 100000 --repeats 5 > flags.json
      - uses: actions/upload-artifact@v4
        with:
          name: flags-python-${{ matrix.python }}
          path: flags.json
          if-no-files-found: error
          retention-days: 14
