name: Emulator regression tests
on:
  pull_request:
  push:
    branches: [ai-re-agent]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest lz4==4.4.5
      - run: python -m pytest -q
      - run: python benchmarks/benchmark_flags.py --ticks 100000 --repeats 3 > flags.json
      - uses: actions/upload-artifact@v4
        with:
          name: flags-python-${{ matrix.python }}
          path: flags.json
          if-no-files-found: error
          retention-days: 14
