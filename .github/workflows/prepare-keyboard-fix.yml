name: Prepare verified keyboard fix
on:
  push:
    branches: [fix/atomic-keyboard-rpc-validation]
    paths: [.github/workflows/prepare-keyboard-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/atomic-keyboard-rpc-validation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply guarded two-pass validation and test
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('main.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'ebe87ad34e1a92c787c522ce8dc225e3bea42259d48775f33e1548f4ef956a6d'
          source = p.read_text()
          start = source.index("        if method in ('input.keyboard', 'keyboard.scancode'):")
          end = source.index("        if method == 'input.state':", start)
          block = source[start:end]
          block = block.replace('            for event in events:\n', '            # Validate the complete batch before queuing any input. A rejected\n            # request must not leave a modifier pressed or release an existing key.\n            scancodes = []\n            for event in events:\n')
          block = block.replace('                kb.PushKeyboardScancode(code if pressed else code | 0x80)\n', '                scancodes.append(code if pressed else code | 0x80)\n            for scancode in scancodes:\n                kb.PushKeyboardScancode(scancode)\n')
          p.write_text(source[:start] + block + source[end:])
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'f62e24ba01cd4b3eacc62919053aaa22c081ea60124d8cdc81cf0575d76b3f3c'
          PY
          python -m unittest discover -s tests -v
      - name: Remove preparation workflow from final diff and commit fix
        run: |
          rm .github/workflows/prepare-keyboard-fix.yml
          git config user.name 'PyPC audit automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py .github/workflows/prepare-keyboard-fix.yml
          git diff --cached --check
          git commit -m 'fix(debugger): validate complete keyboard batches before enqueueing'
          git push origin HEAD:fix/atomic-keyboard-rpc-validation
