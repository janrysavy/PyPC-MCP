name: Temporary debug-session snapshot
on:
  push:
    branches: [fix/pic-initialization-sequence]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz HEAD > /tmp/pypc-session.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: pypc-session-snapshot
          path: /tmp/pypc-session.tar.gz
          retention-days: 1
          if-no-files-found: error
